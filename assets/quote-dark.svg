<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 212" width="1200" height="212">
<style>@font-face{font-family:serif;src:url(data:font/woff;base64,) format('woff')}</style>
<rect x="48" y="6" width="3" height="200" fill="#2AABEE"/>
<text x="78" y="40" font-family="serif" font-size="30" fill="#c9d1d9">Человек формирует робототехнику по своему образу и подобию,</text>
<text x="78" y="86" font-family="serif" font-size="30" fill="#c9d1d9">стремясь отразить себя в искусственном.</text>
<text x="78" y="132" font-family="serif" font-size="30" fill="#c9d1d9">В своём желании творить он приближается к замене себя,</text>
<text x="78" y="178" font-family="serif" font-size="30" fill="#c9d1d9">стирая границы между ними.</text>
</svg>